name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HitAndBlow-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish stable h.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/h.apk" --jq .sha)
          CONTENT=$(base64 -w0 app/build/outputs/apk/release/app-release.apk)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/h.apk" \
            -f message="Publish latest HitAndBlow APK" \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch="${GITHUB_REF_NAME}"
