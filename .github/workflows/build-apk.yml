name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HitAndBlow-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish stable h.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export APK_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/h.apk" --jq .sha)
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          apk = Path("app/build/outputs/apk/release/app-release.apk").read_bytes()
          payload = {
              "message": "Publish latest HitAndBlow APK",
              "content": base64.b64encode(apk).decode("ascii"),
              "sha": os.environ["APK_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          Path("payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/h.apk" --input payload.json
