name: Build Stamp Manager APK

on:
  push:
    branches: [ stamp-manager ]
    paths-ignore:
      - 'StampManager.apk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: StampManager-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export APK_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/StampManager.apk?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          apk = Path("app/build/outputs/apk/release/app-release.apk").read_bytes()
          payload = {
              "message": "Publish Stamp Manager APK",
              "content": base64.b64encode(apk).decode("ascii"),
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          sha = os.environ.get("APK_SHA", "").strip()
          if sha:
              payload["sha"] = sha
          Path("payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/StampManager.apk" --input payload.json
